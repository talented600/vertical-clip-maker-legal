<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vertical Clip Maker by MC — Legal</title>

<style>
  :root {
    color-scheme: dark;
    --bg: #171124;
    --panel: #24183f;
    --panel2: #332052;
    --text: #f7f2ff;
    --muted: #c9bddb;
    --accent: #9b6cff;
    --accent2: #627cff;
    --border: rgba(255,255,255,.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: radial-gradient(circle at top, #38235e 0, var(--bg) 48%);
    color: var(--text);
    line-height: 1.65;
  }
  main {
    width: min(920px, calc(100% - 32px));
    margin: 48px auto;
  }
  .card {
    background: linear-gradient(180deg, rgba(51,32,82,.96), rgba(28,19,52,.96));
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 34px;
    box-shadow: 0 20px 70px rgba(0,0,0,.28);
  }
  h1, h2 { line-height: 1.2; }
  h1 { margin-top: 0; font-size: clamp(2rem, 4vw, 3rem); }
  h2 { margin-top: 2rem; font-size: 1.25rem; }
  p, li { color: var(--muted); }
  a { color: #c8a9ff; }
  .brand {
    display: inline-block;
    margin-bottom: 10px;
    color: #d9c4ff;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .meta {
    color: #a99abb;
    font-size: .95rem;
  }
  .nav {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin: 0 0 20px;
  }
  .nav a {
    text-decoration: none;
    background: rgba(155,108,255,.15);
    border: 1px solid rgba(155,108,255,.28);
    padding: 8px 12px;
    border-radius: 999px;
  }
  footer {
    margin-top: 28px;
    color: #9487a7;
    font-size: .9rem;
  }
</style>
</head>
<body>
<main>
  <div class="card">
    <span class="brand">Vertical Clip Maker by MC</span>
    <h1>Legal information</h1>
    <p>This site contains the legal documents for Vertical Clip Maker by MC and its optional social-media publishing features.</p>
    <div class="nav">
      <a href="./terms.html">Terms of Service</a>
      <a href="./privacy.html">Privacy Policy</a>
    </div>
    <p class="meta">Last updated: 2 October 2026</p>
    <footer>Vertical Clip Maker by MC</footer>
  </div>
</main>
</body>
</html>
